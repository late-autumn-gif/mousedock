name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: ./build.ps1 -Configuration Release -Runtime win-x64

      # ── 可选：代码签名 ────────────────────────────────────────────
      # 未配置证书时这步会被跳过，产物仍可发布（用户会看到 SmartScreen 提示）。
      #
      # - name: Sign (SignPath)
      #   if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
      #     project-slug: mousedock
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: exe
      #     wait-for-completion: true
      #     output-artifact-directory: signed
      #
      # - name: Use signed exe
      #   if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      #   run: Copy-Item signed\MouseDock.exe app\MouseDock.exe -Force

      - name: Package and hash
        shell: pwsh
        run: |
          Copy-Item docs/DEVICE-SUPPORT-1.1.1.md,docs/DEVICE-CATALOGUE-1.1.1.csv,docs/SUPPORT-AUDIT-20261106.md app/
          $package = "MouseDock-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path app/* -DestinationPath $package
          $digest = (Get-FileHash $package -Algorithm SHA256).Hash.ToLower()
          "$digest  $package" | Out-File -Encoding utf8 SHA256.txt
          $manifest = @{ tag_name="${{ github.ref_name }}"; draft=$false; prerelease=$false; assets=@(@{name=$package; browser_download_url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$package";size=(Get-Item $package).Length;digest="sha256:$digest"}) }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath update.json -Encoding utf8


      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MouseDock-${{ github.ref_name }}-win-x64.zip
            SHA256.txt
            update.json
          generate_release_notes: false
          body: |
            > 未签名的构建会让 SmartScreen 显示「未知发布者」。校验方法见 SHA256.txt。
