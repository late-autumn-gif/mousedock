name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/MouseDock/MouseDock.csproj

      - name: Build
        if: hashFiles('src/**/*.cs', 'src/**/*.xaml') != ''
        run: dotnet build src/MouseDock/MouseDock.csproj -c Release --no-restore

      - name: Offline protocol regression
        run: dotnet run --project tests/MouseDock.ProtocolTests/MouseDock.ProtocolTests.csproj -c Release

      - name: Startup surface regression
        shell: pwsh
        run: |
          dotnet build tests/MouseDock.Checks -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($mode in @('dock', 'mini', 'icon', 'taskbar', 'edge')) {
            dotnet run --no-build --project tests/MouseDock.Checks -c Release -- --startup-surface $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Offline discovery and feedback report regression
        run: pwsh -NoProfile -File tests/feedback-report-regression.ps1

      - name: Publish (self-contained single file)
        if: hashFiles('src/**/*.cs', 'src/**/*.xaml') != ''
        run: ./build.ps1 -Configuration Release -Runtime win-x64

      - name: Hash
        if: hashFiles('app/MouseDock.exe') != ''
        run: |
          $h = (Get-FileHash app\MouseDock.exe -Algorithm SHA256).Hash
          "SHA256=$h" | Tee-Object -FilePath app\SHA256.txt
          Write-Output "::notice title=SHA256::$h"

      - uses: actions/upload-artifact@v4
        if: hashFiles('app/MouseDock.exe') != ''
        with:
          name: MouseDock-win-x64
          path: |
            app/MouseDock.exe
            app/SHA256.txt
            app/THIRD-PARTY-NOTICES.md
